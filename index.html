<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>여미새/남미새 test</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=JetBrains+Mono:wght@500;700&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #EDF1F0;
    --ink: #1B2521;
    --ink-soft: #4A544F;
    --go: #3DDC84;
    --go-deep: #1E9E5C;
    --stop: #FF5A5F;
    --stop-deep: #C13237;
    --indigo: #2B2E7A;
    --card: #FFFFFF;
    --line: #D3DAD7;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:'Noto Sans KR', sans-serif;
    min-height:100vh;
    display:flex;
    justify-content:center;
  }
  .app{
    width:100%;
    max-width:460px;
    min-height:100vh;
    padding:24px 20px 40px;
    display:flex;
    flex-direction:column;
  }
  .screen{ display:none; flex:1; flex-direction:column; }
  .screen.active{ display:flex; }
  .eyebrow{
    font-family:'JetBrains Mono', monospace;
    font-size:12px;
    letter-spacing:0.08em;
    color:var(--indigo);
    font-weight:700;
    margin-bottom:8px;
  }
  h1{
    font-family:'Space Grotesk', sans-serif;
    font-size:28px;
    font-weight:700;
    line-height:1.25;
    margin:0 0 16px;
  }
  p.lead{
    font-size:15px;
    line-height:1.7;
    color:var(--ink-soft);
    margin:0 0 24px;
  }
  .rule-card{
    background:var(--card);
    border-radius:16px;
    padding:18px 20px;
    margin-bottom:14px;
    border:1px solid var(--line);
    display:flex;
    align-items:center;
    gap:14px;
  }
  .rule-dot{
    width:44px; height:44px; border-radius:50%;
    flex-shrink:0;
    background-size:cover;
    background-position:center;
    border:2px solid var(--line);
  }
  .gender-btn{
    flex:1;
    font-family:'Space Grotesk', sans-serif;
    font-weight:700;
    font-size:15px;
    background:var(--card);
    color:var(--ink);
    border:2px solid var(--line);
    border-radius:100px;
    padding:12px;
    cursor:pointer;
  }
  .gender-btn.selected{
    background:var(--indigo);
    color:#fff;
    border-color:var(--indigo);
  }
  .rule-text b{ font-size:14px; display:block; margin-bottom:2px; }
  .rule-text span{ font-size:13px; color:var(--ink-soft); }
  .credit{
    font-size:12px;
    color:var(--ink-soft);
    margin-top:auto;
    padding-top:20px;
    border-top:1px dashed var(--line);
  }
  button.primary{
    font-family:'Space Grotesk', sans-serif;
    font-weight:700;
    font-size:16px;
    background:var(--ink);
    color:#fff;
    border:none;
    border-radius:100px;
    padding:16px;
    cursor:pointer;
    margin-top:12px;
    transition:transform 0.1s;
  }
  button.primary:active{ transform:scale(0.97); }
  button.ghost{
    font-family:'Noto Sans KR', sans-serif;
    font-weight:500;
    font-size:14px;
    background:transparent;
    color:var(--ink);
    border:1px solid var(--line);
    border-radius:100px;
    padding:12px;
    cursor:pointer;
    margin-top:10px;
  }

  /* test screen */
  .hud{
    display:flex;
    justify-content:space-between;
    font-family:'JetBrains Mono', monospace;
    font-size:12px;
    color:var(--ink-soft);
    margin-bottom:16px;
  }
  .stage{
    flex:1;
    min-height:280px;
    background:var(--card);
    border-radius:20px;
    border:1px solid var(--line);
    display:flex;
    align-items:center;
    justify-content:center;
    position:relative;
    overflow:hidden;
    user-select:none;
  }
  .target{
    width:210px; height:210px;
    border-radius:50%;
    background:var(--line);
    background-size:cover;
    background-position:center;
    transition:transform 0.08s;
    border:3px solid var(--line);
  }
  .target.go, .target.stop{ animation:pop 0.35s; }
  @keyframes pop{
    0%{ transform:scale(0.6) rotate(-8deg); }
    55%{ transform:scale(1.12) rotate(4deg); }
    100%{ transform:scale(1) rotate(0deg); }
  }
  .stage.flash-error{ animation:flashErr 0.6s; }
  .stage.flash-success{ animation:flashOk 0.5s; }
  @keyframes flashOk{
    0%{ background:var(--card); }
    25%{ background:#B8ECD1; }
    100%{ background:var(--card); }
  }
  .progress-track{
    height:5px;
    background:var(--line);
    border-radius:100px;
    margin-bottom:14px;
    overflow:hidden;
  }
  .progress-fill{
    height:100%;
    width:0%;
    background:var(--indigo);
    border-radius:100px;
    transition:width 0.3s ease;
  }
  @keyframes flashErr{
    0%{ background:var(--card); }
    30%{ background:#FF5A5F; }
    100%{ background:var(--card); }
  }
  .pulse-strip{
    height:52px;
    margin-top:14px;
    background:var(--card);
    border-radius:12px;
    border:1px solid var(--line);
    overflow:hidden;
  }
  .pulse-strip svg{ width:100%; height:100%; display:block; }

  /* result screen */
  .report{
    background:var(--card);
    border-radius:20px;
    border:1px solid var(--line);
    padding:24px 22px;
    position:relative;
  }
  .report::before{
    content:'';
    position:absolute;
    top:0; left:24px; right:24px;
    height:0;
    border-top:2px dashed var(--line);
  }
  .report-label{
    font-family:'JetBrains Mono', monospace;
    font-size:11px;
    color:var(--ink-soft);
    letter-spacing:0.06em;
  }
  .type-name{
    font-family:'Space Grotesk', sans-serif;
    font-size:32px;
    font-weight:700;
    color:var(--indigo);
    margin:6px 0 10px;
  }
  .type-desc{
    font-size:14.5px;
    line-height:1.7;
    color:var(--ink-soft);
    margin-bottom:20px;
  }
  .metric-row{
    display:flex;
    gap:10px;
    margin-bottom:20px;
  }
  .metric{
    flex:1;
    background:var(--bg);
    border-radius:12px;
    padding:12px 14px;
  }
  .metric .m-label{ font-size:11px; color:var(--ink-soft); margin-bottom:4px; }
  .metric .m-val{ font-family:'JetBrains Mono', monospace; font-size:20px; font-weight:700; }
  .actions{ display:flex; gap:10px; margin-top:16px; }
  .tier-item{
    display:flex;
    gap:10px;
    align-items:flex-start;
    padding:12px 14px;
    border-radius:12px;
    margin-bottom:6px;
  }
  .tier-item .tier-num{
    font-family:'JetBrains Mono', monospace;
    font-size:12px;
    color:var(--ink-soft);
    padding-top:2px;
    flex-shrink:0;
    width:16px;
  }
  .tier-item .tier-body b{
    font-family:'Space Grotesk', sans-serif;
    font-size:14px;
    display:block;
    margin-bottom:2px;
  }
  .tier-item .tier-body span{
    font-size:12.5px;
    color:var(--ink-soft);
    line-height:1.5;
  }
  .tier-item.active{
    background:var(--bg);
    border:1px solid var(--indigo);
  }
  .tier-item.active .tier-num{ color:var(--indigo); font-weight:700; }
  .actions button{ flex:1; margin-top:0; }
</style>
</head>
<body>
<div class="app">

  <!-- INTRO -->
  <div class="screen active" id="screen-intro">
    <h1>여미새/남미새 test</h1>


    <div class="rule-card" style="flex-direction:column; align-items:stretch; gap:10px;">
      <b style="font-size:14px;">먼저 본인 성별을 선택하세요</b>
      <div style="display:flex; gap:10px;">
        <button class="gender-btn" id="btn-male" onclick="selectGender('male')">남자</button>
        <button class="gender-btn" id="btn-female" onclick="selectGender('female')">여자</button>
      </div>
    </div>

    <div id="dynamic-rules" style="display:none;">
      <div class="rule-card">
        <div class="rule-dot go" id="go-face-dot"></div>
        <div class="rule-text"><b id="go-rule-title">-</b><span>보이면 최대한 빨리 탭하세요</span></div>
      </div>
      <div class="rule-card">
        <div class="rule-dot stop" id="stop-face-dot"></div>
        <div class="rule-text"><b id="stop-rule-title">-</b><span>보여도 참고 아무것도 하지 마세요</span></div>
      </div>
    </div>

    <button class="primary" id="start-btn" onclick="startTest()" style="display:none;">측정 시작하기</button>
    <div class="credit">결과는 재미 목적의 참고용입니다</div>
  </div>

  <!-- TEST -->
  <div class="screen" id="screen-test">
    <div class="hud">
      <span id="hud-round">TRIAL 0 / 24</span>
      <span id="hud-hint">신호를 기다리세요</span>
    </div>
    <div class="progress-track">
      <div class="progress-fill" id="progress-fill"></div>
    </div>
    <div class="stage" id="stage">
      <div class="target" id="target"></div>
    </div>
    <div class="pulse-strip">
      <svg viewBox="0 0 300 52" preserveAspectRatio="none" id="pulse-svg">
        <polyline id="pulse-line" points="" fill="none" stroke="#2B2E7A" stroke-width="2"/>
      </svg>
    </div>
  </div>

  <!-- RESULT -->
  <div class="screen" id="screen-result">
    <div class="report">
      <div class="report-label" style="font-size:20px; font-weight:700; color:var(--ink); font-family:'Space Grotesk', sans-serif;">당신의 결과는</div>
      <div class="type-name" id="result-type">-</div>
      <div class="type-desc" id="result-desc">-</div>
      <div class="metric-row">
        <div class="metric">
          <div class="m-label">평균 반응속도</div>
          <div class="m-val" id="result-rt">-ms</div>
        </div>
        <div class="metric">
          <div class="m-label">오반응률</div>
          <div class="m-val" id="result-err">-%</div>
        </div>
      </div>
    </div>

    <div class="tier-list" id="tier-list" style="margin-top:14px;"></div>

    <div class="actions">
      <button class="ghost" onclick="location.reload()">다시 하기</button>
      <button class="primary" id="share-btn" onclick="shareResult()">결과 이미지 만들기</button>
    </div>

    <div id="share-preview-wrap" style="display:none; margin-top:16px;">
      <canvas id="share-canvas" width="720" height="900" style="width:100%; border-radius:16px; border:1px solid var(--line);"></canvas>
      <div class="actions">
        <button class="ghost" onclick="downloadShareImage()">이미지 저장</button>
        <button class="primary" onclick="linkShare()">링크 공유</button>
      </div>
      <button class="primary" style="width:100%; background:#FEE500; color:#391B1B; margin-top:10px;" onclick="kakaoShare()">카카오톡으로 공유</button>
      <div id="link-box" style="display:none; margin-top:12px; padding:12px; background:var(--card); border:1px solid var(--indigo); border-radius:12px;">
        <div id="link-box-msg" style="font-size:12px; color:var(--ink-soft); margin-bottom:6px;">아래 텍스트를 길게 눌러 복사하세요</div>
        <input id="link-box-input" readonly style="width:100%; box-sizing:border-box; padding:10px; border-radius:8px; border:1px solid var(--line); font-size:13px; background:var(--bg); color:var(--ink);">
      </div>
    </div>
  </div>

</div>

var GENDER_LABEL = { male:'남자', female:'여자' };

function selectGender(g){
  userGender = g;
  document.getElementById('btn-male').classList.toggle('selected', g==='male');
  document.getElementById('btn-female').classList.toggle('selected', g==='female');

  var oppGender = g === 'male' ? 'female' : 'male';
  document.getElementById('go-rule-title').textContent = GENDER_LABEL[g] + ' 얼굴이';
  document.getElementById('stop-rule-title').textContent = GENDER_LABEL[oppGender] + ' 얼굴이';
  document.getElementById('go-face-dot').style.backgroundImage = 'url(' + FACE_IMAGES[g][0] + ')';
  document.getElementById('stop-face-dot').style.backgroundImage = 'url(' + FACE_IMAGES[oppGender][0] + ')';

  document.getElementById('dynamic-rules').style.display = 'block';
  document.getElementById('start-btn').style.display = 'block';
}

var faceBags = { male: [], female: [] };

function refillBag(gender){
  var pool = FACE_IMAGES[gender];
  var indices = pool.map(function(_, i){ return i; });
  for(var i=indices.length-1; i>0; i--){
    var j = Math.floor(Math.random()*(i+1));
    var tmp = indices[i]; indices[i]=indices[j]; indices[j]=tmp;
  }
  faceBags[gender] = indices;
}

function pickFace(type){
  var gender = type === 'go' ? userGender : (userGender === 'male' ? 'female' : 'male');
  if(faceBags[gender].length === 0) refillBag(gender);
  var idx = faceBags[gender].pop();
  return FACE_IMAGES[gender][idx];
}

for(var i=0;i<TOTAL_TRIALS;i++){
  trials.push(Math.random() < GO_RATIO ? 'go' : 'stop');
}

function startTest(){
  document.getElementById('screen-intro').classList.remove('active');
  document.getElementById('screen-test').classList.add('active');
  initPulse();
  nextTrial();
}

function initPulse(){
  pulsePoints = [];
  for(var x=0;x<=300;x+=6){
    pulsePoints.push([x, pulseBase]);
  }
  drawPulse();
}

function drawPulse(){
  var pts = pulsePoints.map(function(p){ return p[0]+','+p[1]; }).join(' ');
  document.getElementById('pulse-line').setAttribute('points', pts);
}

function spikePulse(down){
  for(var k=0;k<pulsePoints.length-1;k++){
    pulsePoints[k][1] = pulsePoints[k+1][1];
  }
  var last = pulsePoints.length-1;
  pulsePoints[last][1] = down ? pulseBase+16 : pulseBase-16;
  drawPulse();
  setTimeout(function(){
    if(pulsePoints[last]) pulsePoints[last][1] = pulseBase;
    drawPulse();
  }, 120);
}

function nextTrial(){
  if(trialIndex >= TOTAL_TRIALS){
    finishTest();
    return;
  }
  document.getElementById('hud-round').textContent = 'TRIAL ' + (trialIndex+1) + ' / ' + TOTAL_TRIALS;
  document.getElementById('hud-hint').textContent = '신호를 기다리세요';
  document.getElementById('progress-fill').style.width = Math.round((trialIndex/TOTAL_TRIALS)*100) + '%';
  var target = document.getElementById('target');
  target.className = 'target';
  target.style.backgroundImage = 'none';

  var delay = 500 + Math.random()*900;
  timer = setTimeout(function(){
    currentType = trials[trialIndex];
    target.classList.add(currentType);
    target.style.backgroundImage = 'url(' + pickFace(currentType) + ')';
    showTime = Date.now();
    document.getElementById('hud-hint').textContent = '';

    if(currentType === 'stop'){
      var progress = trialIndex / TOTAL_TRIALS;
      var stopWindow = Math.round(1100 - progress * 150);
      stopWindowTimer = setTimeout(function(){
        // survived without tapping = correct inhibition
        results.push({type:'stop', correct:true, rt:null});
        showFeedback(true);
        trialIndex++;
        setTimeout(nextTrial, 400);
      }, stopWindow);
    }
  }, delay);
}

function showFeedback(isCorrect){
  var st = document.getElementById('stage');
  st.style.backgroundColor = isCorrect ? '#DCF5E8' : '#FFE3E4';
  clearTimeout(showFeedback._t);
  showFeedback._t = setTimeout(function(){
    st.style.backgroundColor = '';
  }, 350);
}

document.getElementById('stage').addEventListener('click', function(){
  if(currentType === null) return; // waiting phase, ignore taps
  if(currentType === 'go'){
    var rt = Date.now() - showTime;
    results.push({type:'go', correct:true, rt:rt});
    clearTimeout(timer);
    currentType = null;
    spikePulse(false);
    showFeedback(true);
    trialIndex++;
    setTimeout(nextTrial, 400);
  } else if(currentType === 'stop'){
    clearTimeout(stopWindowTimer);
    results.push({type:'stop', correct:false, rt:null});
    currentType = null;
    spikePulse(true);
    showFeedback(false);
    trialIndex++;
    setTimeout(nextTrial, 400);
  }
});

function finishTest(){
  document.getElementById('progress-fill').style.width = '100%';
  document.getElementById('screen-test').classList.remove('active');
  document.getElementById('screen-result').classList.add('active');

  var goTrials = results.filter(function(r){return r.type==='go';});
  var stopTrials = results.filter(function(r){return r.type==='stop';});
  var goRTs = goTrials.filter(function(r){return r.rt!==null;}).map(function(r){return r.rt;});
  var meanRT = goRTs.length ? Math.round(goRTs.reduce(function(a,b){return a+b;},0)/goRTs.length) : 0;
  var commissionErrors = stopTrials.filter(function(r){return !r.correct;}).length;
  var errRate = stopTrials.length ? Math.round((commissionErrors/stopTrials.length)*100) : 0;

  var crushLabel = userGender === 'male' ? '여미새' : '남미새';
  var chillLabel = userGender === 'male' ? '유교보이' : '유교걸';

  var TIERS = [
    { name:chillLabel, desc:'이성에게 큰 관심이 없다. 연애도 있으면 좋고 없어도 그만이며, 새로운 이성을 일부러 찾지 않는다.' },
    { name:'눈길새', desc:'매력적인 이성을 보면 자연스럽게 눈길은 간다. 하지만 그 이상 행동으로 이어지는 경우는 드물다.' },
    { name:'간잽이', desc:'마음에 드는 이성이 생기면 은근히 탐색한다. SNS를 찾아보거나 분위기를 살피지만, 확실한 신호가 없으면 쉽게 다가가지 않는다.' },
    { name:'플러터', desc:'호감 표현과 썸을 즐기는 편이다. 이성과 장난을 치거나 은근한 플러팅을 자주 하지만, 꼭 진지한 관계를 원하는 것은 아니다.' },
    { name:crushLabel, desc:'새로운 이성에게 끊임없이 관심을 보이고 적극적으로 접근한다. 연애 중에도 다른 이성을 계속 탐색하거나 관심받는 것을 즐기는 경우가 많다.' }
  ];

  var tierIndex;
  if(errRate <= 15) tierIndex = 0;
  else if(errRate <= 35) tierIndex = 1;
  else if(errRate <= 55) tierIndex = 2;
  else if(errRate <= 75) tierIndex = 3;
  else tierIndex = 4;

  var typeName = TIERS[tierIndex].name;
  var typeDesc = TIERS[tierIndex].desc;

  document.getElementById('result-type').textContent = typeName;
  document.getElementById('result-desc').textContent = typeDesc;
  document.getElementById('result-rt').textContent = meanRT + 'ms';
  document.getElementById('result-err').textContent = errRate + '%';

  var listEl = document.getElementById('tier-list');
  listEl.innerHTML = '';
  TIERS.forEach(function(t, i){
    var item = document.createElement('div');
    item.className = 'tier-item' + (i === tierIndex ? ' active' : '');
    item.innerHTML = '<div class="tier-num">' + (i+1) + '</div><div class="tier-body"><b>' + t.name + '</b><span>' + t.desc + '</span></div>';
    listEl.appendChild(item);
  });

  window._shareType = typeName;
  window._shareDesc = typeDesc;
}

function wrapText(ctx, text, x, y, maxWidth, lineHeight){
  var words = text.split(' ');
  var line = '';
  var lines = [];
  for(var n=0;n<words.length;n++){
    var testLine = line + words[n] + ' ';
    if(ctx.measureText(testLine).width > maxWidth && n > 0){
      lines.push(line);
      line = words[n] + ' ';
    } else {
      line = testLine;
    }
  }
  lines.push(line);
  for(var i=0;i<lines.length;i++){
    ctx.fillText(lines[i].trim(), x, y + i*lineHeight);
  }
  return lines.length;
}

function drawShareCanvas(){
  var canvas = document.getElementById('share-canvas');
  var ctx = canvas.getContext('2d');
  var W = canvas.width, H = canvas.height;

  ctx.fillStyle = '#EDF1F0';
  ctx.fillRect(0,0,W,H);

  ctx.fillStyle = '#2B2E7A';
  ctx.font = '700 30px "Space Grotesk", sans-serif';
  ctx.fillText('당신의 결과는', 48, 80);

  ctx.strokeStyle = '#D3DAD7';
  ctx.setLineDash([6,6]);
  ctx.beginPath();
  ctx.moveTo(48, 104);
  ctx.lineTo(W-48, 104);
  ctx.stroke();
  ctx.setLineDash([]);

  ctx.fillStyle = '#1B2521';
  ctx.font = '700 30px "Space Grotesk", sans-serif';
  ctx.fillText('나의 유형', 48, 170);

  ctx.fillStyle = '#2B2E7A';
  ctx.font = '700 56px "Space Grotesk", sans-serif';
  ctx.fillText(window._shareType || '-', 48, 250);

  ctx.fillStyle = '#4A544F';
  ctx.font = '400 22px "Noto Sans KR", sans-serif';
  wrapText(ctx, window._shareDesc || '', 48, 300, W-96, 32);

  var boxY = 480;
  ctx.fillStyle = '#FFFFFF';
  ctx.fillRect(48, boxY, W-96, 140);
  ctx.strokeStyle = '#D3DAD7';
  ctx.strokeRect(48, boxY, W-96, 140);

  ctx.fillStyle = '#4A544F';
  ctx.font = '400 16px "Noto Sans KR", sans-serif';
  ctx.fillText('평균 반응속도', 72, boxY+45);
  ctx.fillText('오반응률', W/2+24, boxY+45);

  ctx.fillStyle = '#1B2521';
  ctx.font = '700 34px "JetBrains Mono", monospace';
  ctx.fillText(document.getElementById('result-rt').textContent, 72, boxY+95);
  ctx.fillText(document.getElementById('result-err').textContent, W/2+24, boxY+95);

  ctx.fillStyle = '#8A8680';
  ctx.font = '400 15px "Noto Sans KR", sans-serif';
  ctx.fillText('여미새/남미새 test', 48, H-40);
}

function shareResult(){
  document.getElementById('share-preview-wrap').style.display = 'block';
  drawShareCanvas();
  document.getElementById('share-preview-wrap').scrollIntoView({behavior:'smooth', block:'nearest'});
}

function downloadShareImage(){
  var canvas = document.getElementById('share-canvas');
  var link = document.createElement('a');
  link.download = 'impulse-report.png';
  link.href = canvas.toDataURL('image/png');
  link.click();
}

function linkShare(){
  var text = '나의 결과는 [' + (window._shareType||'') + ']! 여미새/남미새 test 해보기';
  var fullText = text + ' ' + location.href;
  var box = document.getElementById('link-box');
  var input = document.getElementById('link-box-input');

  function showTextFallback(msg){
    input.value = fullText;
    box.style.display = 'block';
    input.focus();
    input.select();
    box.scrollIntoView({behavior:'smooth', block:'nearest'});
    if(msg) document.getElementById('link-box-msg').textContent = msg;
  }

  var canvas = document.getElementById('share-canvas');

  // Try native share with the actual image file first (works on most mobile browsers)
  canvas.toBlob(function(blob){
    var file = new File([blob], 'yeomisae-namisae-result.png', { type:'image/png' });
    if(navigator.canShare && navigator.canShare({ files:[file] })){
      navigator.share({ files:[file], title:'여미새/남미새 test', text:text }).catch(function(err){
        console.error('이미지 공유 실패, 클립보드 복사 시도:', err);
        tryClipboardImage(blob);
      });
      return;
    }
    tryClipboardImage(blob);
  }, 'image/png');

  function tryClipboardImage(blob){
    if(navigator.clipboard && window.ClipboardItem){
      navigator.clipboard.write([ new ClipboardItem({ 'image/png': blob }) ]).then(function(){
        showTextFallback('이미지가 클립보드에 복사됐어요. 채팅창에 바로 붙여넣기 해보세요. (링크도 아래에 준비해뒀어요)');
      }).catch(function(err){
        console.error('이미지 클립보드 복사 실패:', err);
        showTextFallback('이 브라우저에서는 이미지 복사가 안 돼요. 대신 "이미지 저장" 버튼을 쓰거나 아래 텍스트를 복사해주세요.');
      });
    } else {
      showTextFallback('이 브라우저에서는 이미지 복사가 안 돼요. 대신 "이미지 저장" 버튼을 쓰거나 아래 텍스트를 복사해주세요.');
    }
  }
}
